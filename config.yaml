# All numeric thresholds below are experimental research defaults, not production trading rules.
config_label: experimental-defaults-v1
schema_version: domain-schema-v1
metric_version: core-metrics@1.0.0

execution:
  enabled: false
  mode: research_only

market_data:
  public_only: true
  base_currency: BTC
  ticker_max_age_seconds: 30
  heartbeat_timeout_seconds: 45
  max_clock_skew_seconds: 5
  max_snapshot_skew_ms: 2000
  experimental:
    source: "ACCEPTANCE_REPORT.md 2026-09-15"
    rationale: "Short soaks passed, but target-host history is still required to calibrate these thresholds."

universe:
  option_type: CALL
  min_dte_days: 120
  max_dte_days: 240
  experimental:
    source: DEVELOPMENT_BLUEPRINT.md §2.4
    rationale: "Research hypothesis only; not a permanent strategy constant."

scanner:
  min_open_interest_base_btc: 1.0
  max_spread_fraction: 0.10
  min_cohort_size: 10
  experimental:
    source: OQ-10
    rationale: "Peer and liquidity thresholds need historical validation."

feature_gates:
  local_pricing_production: false
  gamma_metrics: false
  utility_ranking: false
  executable_roll_cashflows: false
  automatic_execution: false
