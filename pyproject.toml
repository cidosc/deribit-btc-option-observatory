[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "btc-option-scanner"
version = "0.3.2"
description = "Research-only foundations for a Deribit BTC inverse option scanner."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<8"]
collector = ["websockets>=13,<17"]

[project.scripts]
btc-option-collector = "btc_option_scanner.collector:main"
btc-option-healthcheck = "btc_option_scanner.collector:healthcheck_main"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_option_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
